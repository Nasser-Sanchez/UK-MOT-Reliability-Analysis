services:
  uk-car-analyser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk-car-analyser
    ports:
      - "8501:8501"
    volumes:
      # Mount the predictions directory so the app can read parquet files
      - ./data/terminal_predictions:/app/data/terminal_predictions:ro
      # Optional: mount the full data directory for debugging
      # - ./data:/app/data:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
