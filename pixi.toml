[workspace]
authors = ["Nasser-Sanchez <jameel02@live.co.uk>"]
channels = ["conda-forge"]
name = "UK Car Analyser"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.11, <3.12"
cuda-toolkit = ">=12.0,<13"
cudnn = ">=8.0,<9"

# Core Data Science (Loose constraints, pinned for Python 3.11 compatibility)
pymc = "*"
numpy = "*"
pandas = ">=2.0,<3"  # Pandas 3.0 requires Python 3.12+
scipy = ">=1.10,<2"   # SciPy 1.18 requires Python 3.12+
scikit-learn = "*"
polars = "*"
arviz = "*"
pytensor = "*"
lifelines = "*"
lightgbm = "*"
matplotlib = "*"
seaborn = "*"
netcdf4 = "*"
python-dateutil = "*"

# Data Handling & Web
duckdb = "*"
pyarrow = "*"
requests = "*"
beautifulsoup4 = "*"
cryptography = "*"

# Dev & Notebooks
jupyter = "*"
jupyterlab = "*"
ipykernel = "*"
pip = ">=26.2.1,<27"

[pypi-dependencies]
duckdb-engine = "*"
numpyro = "*"
nutpie = "*"
playwright = "*"
py7zr = "*"
pyzipper = "*"
plotly = "*"
